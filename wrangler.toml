name = "unsaid"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The page (public/) and the API live in one project: same origin, no CORS, no keys.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers AI: Llama (scene, see SCENE_MODEL) + FLUX.1 schnell (painting), free daily allowance.
[ai]
binding = "AI"

[vars]
# Paintings per IP per day. Only enforced when the LIMITS KV namespace is bound.
DAILY_LIMIT = "3"
# Scene writer. 70B reads emotion far better; 8B stretches the free allowance further.
SCENE_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# SCENE_MODEL = "@cf/meta/llama-3.1-8b-instruct"

# Optional per-IP rate limit. Create it with:
#   npx wrangler kv namespace create LIMITS
# then uncomment and paste the id.
# [[kv_namespaces]]
# binding = "LIMITS"
# id = "paste-your-namespace-id-here"
